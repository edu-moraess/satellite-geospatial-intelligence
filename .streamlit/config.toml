# Satellite Geospatial Intelligence — Streamlit configuration
# Dark GIS/Earth-Observation theme + sane server defaults for
# Streamlit Cloud deployment.

[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
textColor = "#E5EEF7"
font = "sans serif"

[server]
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
