# Satellite Geospatial Intelligence — Streamlit configuration
# Theme: only primary accent is set. Background / text / base mode
# remain under Streamlit Light/Dark control (no forced skin).

[theme]
primaryColor = "#3B82F6"
font = "sans serif"

[server]
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
