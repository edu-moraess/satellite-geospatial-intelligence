# Satellite Geospatial Intelligence — Streamlit configuration
# Explicit dark theme. Native Streamlit surfaces must match the application shell.

[theme]
base = "dark"
primaryColor = "#2BB0D9"
backgroundColor = "#071014"
secondaryBackgroundColor = "#0B171C"
textColor = "#E8EEF2"
font = "sans serif"

[server]
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
